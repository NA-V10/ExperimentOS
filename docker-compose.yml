services:
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/experimentos.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes: [ "eos-data:/data" ]
    ports: [ "8000:8000" ]
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}" }
    ports: [ "3000:3000" ]
    depends_on: [ backend ]
volumes:
  eos-data: {}
